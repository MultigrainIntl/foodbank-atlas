name: JoieOS Compliance

# Runs on every push and pull request. This is the gate that checks whether work
# follows the JoieOS Protocol — not whether it is destructive (GitHub's rulesets
# already stop that), but whether it is honest and governed.
#
# Deterministic only. Every failure names the exact file and the exact rule.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joieos:
    name: JoieOS Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Governance file present and linked
        run: |
          set -e
          FOUND=0
          for f in CLAUDE.md AGENTS.md .claude/CLAUDE.md; do
            if [ -f "$f" ] && grep -qi "joieos" "$f"; then
              echo "OK  $f references JoieOS governance"; FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL CONTROL-INHERIT-001: no CLAUDE.md or AGENTS.md referencing JoieOS."
            echo "Every project must inherit the protocol. See ai-project-operating-system/joieos/JOIEOS.md"
            exit 1
          fi

      - name: No committed secrets
        run: |
          set -e
          EX="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist
              --exclude-dir=build --exclude-dir=.next --exclude-dir=vendor
              --exclude=*.lock --exclude=package-lock.json --exclude=joieos-compliance.yml"

          # SERVER-SIDE SECRETS — these are never safe in a repo. Hard failure.
          SECRET='(sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|"private_key_id"|service_account)'
          HITS=$(grep -rIEl "$SECRET" . $EX 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "FAIL CONTROL-SECRET-001: server-side credential committed in:"
            echo "$HITS"
            echo "Rotate the credential first, then remove it from the repository and its history."
            exit 1
          fi
          echo "OK  no server-side credentials"

          # CLIENT-SIDE API KEYS (Firebase/Maps AIza...) are public by design: they ship in
          # the browser bundle. Not a breach, so not a failure — but they must be restricted
          # at the provider, because that is the only thing protecting them.
          CLIENT=$(grep -rIEl 'AIza[0-9A-Za-z_-]{35}' . $EX 2>/dev/null || true)
          if [ -n "$CLIENT" ]; then
            echo "NOTE CONTROL-SECRET-002: client-side API key present in:"
            echo "$CLIENT"
            echo "This is expected for Firebase/Maps web config. Security depends entirely on"
            echo "provider-side restrictions (Firestore/Storage rules, HTTP referrer limits),"
            echo "not on secrecy. Confirm those restrictions exist."
          fi

      - name: No unverified success claims in governance records
        run: |
          set -e
          # "VERIFIED" means independently verified by a different actor. A record may not
          # assert it without naming who verified it.
          BAD=""
          for f in $(grep -rIl --include='*.md' --include='*.yaml' --include='*.yml' \
                       -E '\bINDEPENDENTLY_VERIFIED\b|\bVERIFIED\b' . \
                       --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null || true); do
            case "$f" in
              *node_modules*|*/.github/workflows/joieos-compliance.yml) continue ;;
            esac
            if grep -qE '\bINDEPENDENTLY_VERIFIED\b' "$f" && \
               ! grep -qiE 'verifier|verified_by|independent_verification_record|identity_provenance' "$f"; then
              BAD="$BAD $f"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "FAIL CONTROL-VERIFY-001: INDEPENDENTLY_VERIFIED asserted with no verifier identity in:"
            for f in $BAD; do echo "  $f"; done
            echo 'Same-actor testing is IMPLEMENTATION_TESTED, never VERIFIED.'
            exit 1
          fi
          echo "OK  no unattributed verification claims"

      - name: Project build and tests, when defined
        run: |
          set -e
          if [ ! -f package.json ]; then echo "SKIP  no package.json"; exit 0; fi
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          if node -e "process.exit(require('./package.json').scripts?.build?0:1)" 2>/dev/null; then
            echo "--- npm run build ---"; npm run build --if-present
          else echo "SKIP  no build script"; fi
          if node -e "process.exit(require('./package.json').scripts?.test?0:1)" 2>/dev/null; then
            echo "--- npm test ---"; npm test --if-present
          else echo "SKIP  no test script"; fi

      - name: Result
        run: echo "JoieOS Compliance passed. This proves the checks above only — not that the product works."
