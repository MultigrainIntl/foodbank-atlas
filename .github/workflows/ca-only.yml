name: Build Canada only (debug)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Canadian food banks (StatCan, keyless)
        run: |
          python -m pip install --quiet geopandas pyogrio shapely
          for c in config/ca/*.json; do
            echo "== $c =="
            python build_ca.py "$c"
          done
          python make_index.py
          ls -la docs/ docs/data/
      - name: Link guard - truckload/order links must point to on-site /order
        run: python check_links.py docs

      - name: Commit generated maps
        run: |
          git config user.name  atlas-bot
          git config user.email atlas-bot@users.noreply.github.com
          git add -f docs/*.html docs/data/*.json
          git commit -m "build: canada $(date -u +%F-%H%M)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i rejected; retrying"; sleep 4
          done
          echo "push failed"; exit 1
